<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <!-- Outer white ring + yellow disc (matches track-moto-marker style) -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="25.5" fill="#FFCC00"/>
  <!-- Simple isometric delivery package -->
  <g transform="translate(32 31)">
    <!-- Top face -->
    <path d="M0,-14 L14,-6 L0,2 L-14,-6 Z" fill="#C48A3A"/>
    <!-- Left face -->
    <path d="M-14,-6 L0,2 L0,16 L-14,8 Z" fill="#A86F2C"/>
    <!-- Right face -->
    <path d="M14,-6 L0,2 L0,16 L14,8 Z" fill="#8F5A1F"/>
    <!-- Packing tape on top -->
    <path d="M-2.2,-12.6 L2.2,-10.1 L2.2,-1.4 L-2.2,-3.9 Z" fill="#6B4012"/>
    <!-- Tape down left -->
    <path d="M-2.2,-3.9 L2.2,-1.4 L2.2,5.2 L-2.2,2.7 Z" fill="#5A350F" opacity="0.95"/>
  </g>
</svg>
